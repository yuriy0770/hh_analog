{% extends 'main/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">✏️ Редактирование компании</h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Название компании</label>
                            <input type="text" name="name" class="form-control" value="{{ company.name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Описание компании</label>
                            <textarea name="description" class="form-control" rows="5" required>{{ company.description }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Текущий логотип</label>
                            {% if company.logo %}
                                <div class="mb-2">
                                    <img src="{{ company.logo.url }}" style="max-height: 100px;" class="border rounded">
                                </div>
                            {% endif %}
                            <label class="form-label fw-bold">Новый логотип (если хотите заменить)</label>
                            <input type="file" name="logo" class="form-control" accept="image/*">
                        </div>
                        
                        <hr>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'employers:dashboard' %}" class="btn btn-secondary">
                                Отмена
                            </a>
                            <button type="submit" class="btn btn-success">
                                💾 Сохранить изменения
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
